<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Honey ❤️</title>
  <style>
    body {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Arial', sans-serif;
      text-align: center;
    }
    .box {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-width: 320px;
    }
    h1 {
      color: #e63946;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #yes {
      background: #ff4d6d;
      color: white;
    }
    #no {
      background: #adb5bd;
      position: absolute;
    }
  </style>
</head>
<body>

<div class="box">
  <h1>Harish has a question 💖</h1>
  <p>Honey, will you be my Valentine? 🌹</p>
  <button id="yes" onclick="yesClick()">YES 😍</button>
  <button id="no" onmouseover="moveNo()">NO 😜</button>
</div>

<script>
  function yesClick() {
    document.body.innerHTML = "<h1>Yay! 💕 I knew it, Honey! ❤️</h1>";
  }
  function moveNo() {
    const btn = document.getElementById("no");
    btn.style.left = Math.random() * 80 + "vw";
    btn.style.top = Math.random() * 80 + "vh";
  }
</script>

</body>
</html>
